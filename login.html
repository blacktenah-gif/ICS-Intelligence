<!doctype html><html lang="en" data-theme="blue"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public account | ICS Intelligence</title><link rel="stylesheet" href="/app.css"></head><body><main class="auth-layout"><section class="auth-card"><a class="brand" href="/"><span class="logo">ICS</span><span>ICS Intelligence</span></a><h1>Public account</h1><p class="muted">Sign in or create a guardian account.</p><div class="row"><button id="loginTab" class="secondary" type="button">Sign in</button><button id="registerTab" class="secondary" type="button">Register</button><button id="verifyTab" class="secondary" type="button">Verify email</button></div><div id="notice" class="notice hidden" role="status"></div>
<form id="loginForm"><div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" required></div><div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button type="submit" style="width:100%">Sign in</button></form>
<form id="registerForm" class="hidden"><div class="field"><label for="registerEmail">Email</label><input id="registerEmail" type="email" autocomplete="email" required></div><div class="field"><label for="registerPassword">Password (at least 10 characters)</label><input id="registerPassword" type="password" minlength="10" autocomplete="new-password" required></div><button type="submit" style="width:100%">Create account and send code</button></form>
<form id="verifyForm" class="hidden"><div class="field"><label for="verifyEmail">Email</label><input id="verifyEmail" type="email" required></div><div class="field"><label for="verifyCode">6-digit verification code</label><input id="verifyCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><button type="submit" style="width:100%">Verify email</button></form>
<div id="themeBox" class="notice"><strong>Choose your theme</strong><div class="theme-options" style="margin-top:10px"><button type="button" class="theme-option" data-theme-choice="blue"><span class="swatch blue"></span>Blue</button><button type="button" class="theme-option" data-theme-choice="green"><span class="swatch green"></span>Green</button><button type="button" class="theme-option" data-theme-choice="purple"><span class="swatch purple"></span>Purple</button><button type="button" class="theme-option" data-theme-choice="dark"><span class="swatch dark-swatch"></span>Dark</button></div><small class="muted">Before sign-in, this preference is saved on this device. After sign-in, save it to your account from your account settings in a future release.</small></div><p><a href="/">← Back to website</a></p></section></main><script src="/login.js"></script></body></html>
