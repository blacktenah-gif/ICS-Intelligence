<!doctype html><html lang="en" data-theme="blue"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator login | ICS Intelligence</title><link rel="stylesheet" href="/app.css"></head><body><main class="auth-layout"><section class="auth-card"><a class="brand" href="/"><span class="logo">ICS</span><span>ICS Intelligence</span></a><h1>Administrator portal</h1><p class="muted">Restricted access. Sign in with your authorized administrator account.</p><div id="notice" class="notice hidden" role="status"></div><form id="loginForm"><div class="field"><label for="email">Administrator email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button type="submit" style="width:100%">Continue to email verification</button></form><form id="codeForm" class="hidden"><div class="field"><label for="code">Email verification code</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><button type="submit" style="width:100%">Verify and open dashboard</button></form><hr><details><summary><strong>First-time administrator setup</strong></summary><p class="muted">Use this once after configuring SMTP and ADMIN_SETUP_TOKEN in your private .env file. Never share the setup token.</p><form id="setupForm"><div class="field"><label for="setupToken">One-time setup token</label><input id="setupToken" type="password" required></div><div class="field"><label for="setupEmail">Administrator email</label><input id="setupEmail" type="email" required></div><div class="field"><label for="setupPassword">Password (at least 12 characters)</label><input id="setupPassword" type="password" minlength="12" required></div><button type="submit">Send setup verification code</button></form><form id="setupCodeForm" class="hidden"><div class="field"><label for="setupCode">Email verification code</label><input id="setupCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><button type="submit">Verify and create administrator</button></form></details><p><a href="/">← Back to public website</a></p></section></main><script src="/admin-login.js"></script></body></html>
